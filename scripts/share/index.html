<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubble share image</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
<style>
  /* 1200×630: the link-preview image (scripts/make-share.md). Uses the site's real orb and the app's colours. */
  html, body { margin: 0; background: #040409; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f2f1f5; font-family: 'Geist Mono', ui-monospace, monospace; }
  .grid { position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(255,255,255,.1) 1px, transparent 1.4px); background-size: 22px 22px;
    mask-image: radial-gradient(60% 70% at 72% 50%, #000 0%, transparent 100%); -webkit-mask-image: radial-gradient(60% 70% at 72% 50%, #000 0%, transparent 100%); }
  .glow { position: absolute; inset: 0; background: radial-gradient(34% 52% at 72% 50%, rgba(143,77,255,.22) 0%, rgba(4,4,9,0) 72%); }
  .orb { position: absolute; left: 860px; top: 315px; transform: translate(-50%, -50%); }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; }
  .brand i { width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px rgba(255,255,255,.6); }
  h1 { margin: 0; font-size: 64px; line-height: 1.02; font-weight: 500; letter-spacing: -.045em; }
  h1 b { font-weight: 500; color: rgb(255,184,56); }
  p { margin: 0; font-size: 21px; line-height: 1.5; color: rgba(255,255,255,.62); }
  .foot { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div><div class="glow"></div>
  <div class="orb" id="orb"></div>
  <div class="text">
    <div class="brand"><i></i>Bubble</div>
    <h1>Look away until Claude <b>needs you.</b></h1>
    <p>A particle orb for macOS that shows what every Claude Code session is doing.</p>
    <div class="foot">Free · macOS 14+ · Open source</div>
  </div>
</div>
<script src="../../js/vendor/orbShared.js"></script>
<script src="../../data/app.js"></script>
<script src="../../js/vendor/orbParticles.js"></script>
<script src="../../js/palette.js"></script>
<script>
  const o = document.createElement('orb-particles');
  for (const [k, v] of Object.entries({ state: new URLSearchParams(location.search).get('state') || 'working', work: 'wave', palette: 'app', size: new URLSearchParams(location.search).get('size') || '520', outcome: 'success' })) o.setAttribute(k, v);
  document.getElementById('orb').appendChild(o);
</script>
</body>
</html>
